name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: api } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: api/pyproject.toml }
      - run: pip install ".[dev]"
      - run: pytest -q

  realtime:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: realtime } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: realtime/package-lock.json }
      - run: npm ci
      - run: npm run typecheck

  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
      - run: npx eslint src
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: web/test-results }

  images:
    runs-on: ubuntu-latest
    needs: [api, realtime]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f realtime/Dockerfile realtime
      # the api image needs ml/artifacts, which are not committed; build it on the deploy box
